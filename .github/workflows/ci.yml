name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, to catch upstream drift in vendored assets even when nobody pushes.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vendor:
    name: Vendored assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Verifies the vendored CSS matches its recorded sha384 and that no page
      # has reintroduced a third-party CDN reference. See vendor/README.md.
      - name: Verify vendored assets
        run: ./vendor/verify.sh

  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yield_max
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stable
            toolchain: stable
          # Beta is advisory: it warns us about breakage before it reaches
          # stable, but must not block a PR on an upstream regression.
          - name: beta
            toolchain: beta
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: yield_max

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The fixtures carry their own expected answers, but this also proves the
      # binary itself behaves, not just the library.
      - name: End-to-end CLI check
        run: |
          cargo run --quiet -p yield_max-cli -- test_wafer.txt - > /tmp/report.txt
          grep -q '^# good=57 (g4=0 g3=0 g2=0 g1=57) defect=36 overhang=0 sites=93 yield=61.3%$' /tmp/report.txt

          # Version 4 names the region's center die and labels both axes: row
          # letters (skipping 'N') down the left, column numbers across the
          # top. The round-trip diff below then covers reading them back.
          grep -q '^# yield_max 4  region=row2,col4 center=H10 tiebreak=grade$' /tmp/report.txt
          grep -q '^# 12345678901234567$' /tmp/report.txt
          grep -q '^O ..1XX1XXXXX1111..$' /tmp/report.txt
          if grep -q '^N ' /tmp/report.txt; then
            echo "::error::'N' must be skipped in the row labels"
            exit 1
          fi

          # Every run also writes an HTML report. With the text report going to
          # stdout there is no output path to sit beside, so it is named after
          # the input instead.
          test -f test_wafer_optimal.html

          # Our own output must be valid input and reproduce itself exactly.
          cargo run --quiet -p yield_max-cli -- /tmp/report.txt - > /tmp/again.txt
          diff /tmp/report.txt /tmp/again.txt

          # The HTML report has to render from wherever it was written, so it
          # may not reference anything outside itself or need script.
          cargo run --quiet -p yield_max-cli -- test_wafer.txt /tmp/html_check.txt > /dev/null
          grep -q '^<!doctype html>$' /tmp/html_check.html
          grep -q 'data-glyph=' /tmp/html_check.html
          grep -q 'Best 200mm region' /tmp/html_check.html
          if grep -qE '<script|https?://|href=|src=' /tmp/html_check.html; then
            echo "::error::the HTML report must be self-contained"
            exit 1
          fi

          # Nothing in it varies between runs, so two reports of one input are
          # byte-identical and a stale one shows up as a difference.
          cargo run --quiet -p yield_max-cli -- test_wafer.txt /tmp/html_again.txt > /dev/null
          diff /tmp/html_check.html /tmp/html_again.html

          # The JSON interface reports where the HTML went.
          cargo run --quiet -p yield_max-cli -- --json test_wafer.txt /tmp/json_out.txt \
            | grep -q '"html":"/tmp/json_out.html"'

          # Asking for the *text* report at a .html path would have the HTML
          # report land on top of it; that must fail rather than clobber it.
          if cargo run --quiet -p yield_max-cli -- test_wafer.txt /tmp/collide.html 2>/dev/null; then
            echo "::error::a text output path that the HTML report would overwrite was accepted"
            exit 1
          fi

          # The graded objective, end to end: on tiebreak_divergent both
          # policies capture 17 grade-4 die but choose different regions, so
          # this fails if --tiebreak is ignored *or* if it leaks into the
          # grade-4 count it is not supposed to affect.
          for policy in grade total; do
            cargo run --quiet -p yield_max-cli -- --tiebreak=$policy \
              testdata/tiebreak_divergent.txt - > /tmp/$policy.txt
            grep -q "tiebreak=$policy" /tmp/$policy.txt
            grep -q 'g4=17' /tmp/$policy.txt
          done
          grep -q '^# yield_max 4  region=row2,col2 center=H8 tiebreak=grade$' /tmp/grade.txt
          grep -q '^# yield_max 4  region=row4,col2 center=J8 tiebreak=total$' /tmp/total.txt

          # A report records its policy, so re-running with no flag reproduces
          # it rather than silently falling back to the default.
          cargo run --quiet -p yield_max-cli -- /tmp/total.txt - > /tmp/total_again.txt
          diff /tmp/total.txt /tmp/total_again.txt

          # A version-2 report (in-region good die spelled Z) must still parse.
          cargo run --quiet -p yield_max-cli -- testdata/legacy_z_roundtrip.txt - > /tmp/legacy.txt
          grep -q '^# yield_max 4  region=row2,col4 center=H10 tiebreak=grade$' /tmp/legacy.txt
          if grep -q 'Z' /tmp/legacy.txt; then
            echo "::error::version 2's Z glyph must never be emitted"
            exit 1
          fi

          # Malformed input must fail loudly rather than be reinterpreted.
          if cargo run --quiet -p yield_max-cli -- testdata/invalid/short_row.txt - 2>/dev/null; then
            echo "::error::a malformed wafer map was accepted"
            exit 1
          fi

          # A row label that disagrees with its position means a row was
          # inserted, dropped or reordered; trusting the position and
          # discarding the label would analyze the wrong wafer.
          if cargo run --quiet -p yield_max-cli -- testdata/invalid/mislabeled_row.txt - 2>/dev/null; then
            echo "::error::a mislabeled grid row was accepted"
            exit 1
          fi

          # So must an unrecognized tie-break: falling back to the default
          # would answer a different question than the one asked.
          if cargo run --quiet -p yield_max-cli -- --tiebreak=sideways test_wafer.txt - 2>/dev/null; then
            echo "::error::an unknown --tiebreak value was accepted"
            exit 1
          fi

  wasm:
    name: WASM bindings and smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yield_max/yield_max-wasm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: yield_max

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # pkg/ is checked in so the page works from a plain static server with
      # no build step. Keeping that honest needs two checks.
      #
      # Note we deliberately do NOT compare the .wasm byte-for-byte. It embeds
      # absolute paths ($CARGO_HOME, the rustc commit hash) in panic metadata,
      # so it legitimately differs between machines while being functionally
      # identical. Comparing bytes would fail on every runner regardless of
      # whether anything was actually wrong.

      # 1. The committed wasm must actually work. This is the property that
      #    matters, and a byte comparison never verified it at all.
      - name: Committed wasm passes a functional smoke test
        run: node smoke-test.mjs

      # 2. The generated JS/TS artifacts contain no machine-specific content,
      #    so these can be compared exactly. A drifting API surface -- an
      #    export added in Rust but never rebuilt into pkg/ -- shows up here.
      - name: Generated JS/TS bindings match the source
        run: |
          wasm-pack build --target web
          rm -f pkg/.gitignore   # generated, deliberately not committed
          if ! git diff --quiet -- pkg/yield_max_wasm.js pkg/yield_max_wasm.d.ts \
                                   pkg/yield_max_wasm_bg.wasm.d.ts pkg/package.json; then
            echo "::error::pkg/ bindings are stale; run 'wasm-pack build --target web' in yield_max-wasm and commit the result"
            git diff -- pkg/yield_max_wasm.js pkg/yield_max_wasm.d.ts \
                        pkg/yield_max_wasm_bg.wasm.d.ts pkg/package.json
            exit 1
          fi
          echo "Bindings match a fresh build."

      # 3. And the freshly built wasm must pass the same smoke test, proving
      #    the current source is good -- not just the committed artifact.
      - name: Freshly built wasm passes the same smoke test
        run: node smoke-test.mjs

  pages:
    name: Static pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every tool is a static file served from a subdirectory, so a broken
      # relative path is a real (and silent) failure mode.
      - name: Check local asset references resolve
        run: |
          status=0
          while IFS= read -r page; do
            dir=$(dirname "$page")
            # Pull href/src values that are neither absolute URLs nor data URIs.
            grep -oE '(href|src)="[^"#?]+"' "$page" \
              | sed -E 's/^(href|src)="//; s/"$//' \
              | grep -vE '^(https?:|data:|mailto:|#|/)' \
              | while IFS= read -r ref; do
                  target="$dir/$ref"
                  if [ ! -e "$target" ]; then
                    echo "::error file=$page::broken reference: $ref"
                    exit 1
                  fi
                done || status=1
          done < <(find . -name '*.html' -not -path './.git/*')
          exit $status

      - name: Every tool is linked from the index
        run: |
          status=0
          for dir in crosswind regexer yield_max; do
            if ! grep -q "$dir" index.html; then
              echo "::error::$dir is not linked from index.html"
              status=1
            fi
          done
          exit $status
