<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yield Max</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css"
    />
    <style>
      body {
        padding-bottom: 4rem;
      }

      header {
        padding-top: 2rem;
      }

      header p {
        color: var(--pico-muted-color);
      }

      textarea,
      pre {
        font-family: monospace;
        font-size: 0.9rem;
      }

      textarea {
        resize: vertical;
      }

      .actions {
        display: flex;
        gap: 0.75rem;
        margin-top: 0.75rem;
      }

      .actions button {
        width: auto;
      }

      #error {
        margin-top: 1.5rem;
        color: var(--pico-del-color, #c0392b);
      }

      #results {
        margin-top: 2rem;
      }

      .summary {
        font-size: 1rem;
        margin-bottom: 1.25rem;
      }

      /* Wafer visualization — token roles per the dataviz palette (light mode only,
         matching this site's forced data-theme="light"). Status colors (good/critical)
         and the region-selection accent (categorical slot 1) are used verbatim from
         the documented default palette; nothing here is eyeballed. */
      .viz-root {
        --chart-surface: #fcfcfb;
        --text-secondary: #52514e;
        --text-muted: #898781;
        --border-hairline: rgba(11, 11, 11, 0.1);
        --cell-absent: #e1e0d9;
        --cell-good: #0ca30c;
        --cell-defect: #d03b3b;
        --region-accent: #2a78d6;
      }

      .wafer-viz {
        background: var(--chart-surface);
        border: 1px solid var(--border-hairline);
        border-radius: var(--pico-border-radius);
        padding: 1.25rem;
        display: flex;
        flex-wrap: wrap;
        gap: 1.75rem;
        align-items: flex-start;
      }

      .wafer-grid {
        display: grid;
        grid-template-columns: repeat(17, 1fr);
        width: min(100%, 30rem);
        aspect-ratio: 1 / 1;
        gap: 0;
        flex-shrink: 0;
      }

      .wafer-cell {
        position: relative;
        aspect-ratio: 1 / 1;
        background: var(--cell-absent);
        border: 3px solid transparent;
        box-sizing: border-box;
        box-shadow: inset 0 0 0 1px #0b0b0b;
      }

      .wafer-cell[data-state='good'] {
        background: var(--cell-good);
      }

      .wafer-cell[data-state='defect'] {
        background: var(--cell-defect);
      }

      .wafer-cell:hover,
      .wafer-cell:focus-visible {
        filter: brightness(1.15);
        outline: none;
        z-index: 1;
      }

      .legend {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        font-size: 0.85rem;
        color: var(--text-secondary);
        min-width: 11rem;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 0.55rem;
      }

      .legend-swatch {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        flex-shrink: 0;
        background: var(--cell-absent);
      }

      .legend-swatch.good {
        background: var(--cell-good);
      }

      .legend-swatch.defect {
        background: var(--cell-defect);
      }

      .legend-swatch.region {
        background: transparent;
        border: 3px solid var(--region-accent);
      }

      #cell-tooltip {
        position: fixed;
        pointer-events: none;
        background: #0b0b0b;
        color: #ffffff;
        font-size: 0.78rem;
        padding: 0.35rem 0.55rem;
        border-radius: 4px;
        z-index: 10;
        white-space: nowrap;
      }
      #cell-tooltip[hidden] {
        display: none;
      }

      details.raw-output {
        margin-top: 1.5rem;
      }

      details.raw-output summary {
        cursor: pointer;
        color: var(--text-secondary, var(--pico-muted-color));
      }

      #marked-map {
        background: var(--pico-card-background-color);
        border: 1px solid var(--pico-muted-border-color);
        border-radius: var(--pico-border-radius);
        padding: 0.9rem 1.1rem;
        margin-top: 0.75rem;
        white-space: pre;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Yield Max</h1>
      <p>
        Paste a 300mm wafer map (17x17 grid of <code>.</code>/<code>X</code>/<code>1</code>) and find the
        highest-yielding placement of the 200mm region.
      </p>
    </header>

    <main>
      <label for="wafer-input">Wafer map</label>
      <textarea id="wafer-input" rows="17" spellcheck="false" placeholder=".....1111111....."></textarea>

      <div class="actions">
        <button id="load-sample-btn" class="secondary">Load sample</button>
        <button id="analyze-btn">Analyze</button>
      </div>

      <div id="error" hidden></div>

      <div id="results" hidden>
        <p class="summary">
          Best 200mm region: top-left at (row <strong id="result-row"></strong>, col
          <strong id="result-col"></strong>), good die count: <strong id="result-count"></strong>
        </p>

        <div class="viz-root">
          <div class="wafer-viz">
            <div id="wafer-grid" class="wafer-grid" role="grid" aria-label="Wafer die map with selected 200mm region"></div>
            <div class="legend">
              <div class="legend-item"><span class="legend-swatch good"></span>Good die</div>
              <div class="legend-item"><span class="legend-swatch defect"></span>Defect die</div>
              <div class="legend-item"><span class="legend-swatch"></span>Not present</div>
              <div class="legend-item"><span class="legend-swatch region"></span>Selected 200mm region</div>
            </div>
          </div>
        </div>

        <details class="raw-output">
          <summary>Show raw marked wafer text</summary>
          <pre id="marked-map"></pre>
        </details>
      </div>
    </main>

    <div id="cell-tooltip" role="tooltip" hidden></div>

    <script type="module">
      import init, { analyze_wafer } from './yield_max-wasm/pkg/yield_max_wasm.js';

      await init();

      const SAMPLE = `.....1111111.....
...XX111111XXX...
..X11X111X1X111..
.XXX1111111X111X.
.XXXX1111XX11X1X.
XXXXX1X111111XX1X
XXXXXX1111111X1XX
X1X111X1X1X11X1XX
XXX1XXXXXXX111XXX
1XX1XXX1X11X11XX1
XXXXXXXXX1111X11X
.11XXXXX11111X11.
.X1XXX1X11111XXX.
..1XX1XXXXX1111..
...XXXXXXXXXXX...
....X11111X1X....
.......XXXX......`;

      // Mirrors the MASK_TEMPLATE constant in yield_max-core/src/lib.rs — must stay in sync.
      const MASK = [
        '...OOOOO...',
        '..OOOOOOO..',
        '.OOOOOOOOO.',
        'OOOOOOOOOOO',
        'OOOOOOOOOOO',
        'OOOOOOOOOOO',
        'OOOOOOOOOOO',
        '.OOOOOOOOO.',
        '.OOOOOOOOO.',
        '..OOOOOOO..',
        '....OOO....',
      ];
      const BOARD_SIZE = 17;
      const MASK_SIZE = 11;

      const input = document.getElementById('wafer-input');
      const errorBox = document.getElementById('error');
      const results = document.getElementById('results');
      const grid = document.getElementById('wafer-grid');
      const tooltip = document.getElementById('cell-tooltip');

      document.getElementById('load-sample-btn').addEventListener('click', () => {
        input.value = SAMPLE;
      });

      function inRegion(row, col, best) {
        const dr = row - best.row;
        const dc = col - best.col;
        if (dr < 0 || dr >= MASK_SIZE || dc < 0 || dc >= MASK_SIZE) return false;
        return MASK[dr][dc] === 'O';
      }

      function showTooltip(target, text) {
        tooltip.textContent = text;
        tooltip.hidden = false;
        const rect = target.getBoundingClientRect();
        tooltip.style.left = `${rect.left + rect.width / 2}px`;
        tooltip.style.top = `${rect.top - 8}px`;
        tooltip.style.transform = 'translate(-50%, -100%)';
      }

      function hideTooltip() {
        tooltip.hidden = true;
      }

      function renderGrid(rows, best) {
        grid.textContent = '';
        const stateLabel = { good: 'Good die', defect: 'Defect die', absent: 'Not present' };

        for (let r = 0; r < BOARD_SIZE; r++) {
          const rowEl = document.createElement('div');
          rowEl.setAttribute('role', 'row');
          rowEl.style.display = 'contents';
          grid.appendChild(rowEl);

          for (let c = 0; c < BOARD_SIZE; c++) {
            const ch = rows[r][c];
            const state = ch === '1' ? 'good' : ch === 'X' ? 'defect' : 'absent';
            const region = inRegion(r, c, best);

            const cell = document.createElement('div');
            cell.className = 'wafer-cell';
            cell.setAttribute('role', 'gridcell');
            cell.dataset.state = state;
            cell.dataset.region = String(region);
            cell.tabIndex = 0;

            if (region) {
              if (!inRegion(r - 1, c, best)) cell.style.borderTopColor = 'var(--region-accent)';
              if (!inRegion(r + 1, c, best)) cell.style.borderBottomColor = 'var(--region-accent)';
              if (!inRegion(r, c - 1, best)) cell.style.borderLeftColor = 'var(--region-accent)';
              if (!inRegion(r, c + 1, best)) cell.style.borderRightColor = 'var(--region-accent)';
            }

            const label = `Row ${r}, col ${c}: ${stateLabel[state]}${region ? ' — in selected region' : ''}`;
            cell.setAttribute('aria-label', label);

            cell.addEventListener('pointerenter', () => showTooltip(cell, label));
            cell.addEventListener('pointerleave', hideTooltip);
            cell.addEventListener('focus', () => showTooltip(cell, label));
            cell.addEventListener('blur', hideTooltip);

            rowEl.appendChild(cell);
          }
        }
      }

      document.getElementById('analyze-btn').addEventListener('click', () => {
        errorBox.hidden = true;
        results.hidden = true;
        hideTooltip();

        try {
          const analysis = analyze_wafer(input.value);
          const best = { row: analysis.row, col: analysis.col };

          document.getElementById('result-row').textContent = analysis.row;
          document.getElementById('result-col').textContent = analysis.col;
          document.getElementById('result-count').textContent = analysis.good_die_count;
          document.getElementById('marked-map').textContent = analysis.marked_map;

          const rows = input.value.split('\n').filter((l) => l.trim().length > 0);
          renderGrid(rows, best);

          results.hidden = false;
        } catch (err) {
          errorBox.textContent = typeof err === 'string' ? err : (err.message || String(err));
          errorBox.hidden = false;
        }
      });
    </script>
  </body>
</html>
